name: CI

on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Sanity scan repo (JSON)
        run: |
          secrets-hygiene . 

      - name: Sanity scan repo (Markdown)
        run: |
          secrets-hygiene . --format md
